name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies (incl. dev tools)
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files (syntax)
        run: |
          for f in *.php app/*.php tests/*.php; do
            php -l "$f"
          done

      - name: Lint JavaScript
        run: |
          node --check sanitize.js
          node --check sw.js

      - name: Run PHP unit tests
        run: |
          php tests/test_weather.php
          php tests/test_ratelimit.php
          php tests/test_onecall.php

      - name: Run PHP HTTP integration tests (APCu cache path enabled)
        run: php tests/test_http.php

      - name: Run controller integration tests
        run: php tests/test_controller.php

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis (PHPStan)
        run: php vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=512M

      - name: Code style (PHP-CS-Fixer, dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for leftover secrets / obvious issues
        run: |
          echo "Scanning for accidentally committed API keys..."
          if grep -rIln "OPENWEATHERMAP_API_KEY=[A-Za-z0-9]\{20,\}\|appid=[A-Za-z0-9]\{20,\}" \
              --exclude-dir=.git --exclude-dir=vendor --exclude-dir=var . ; then
            echo "::error::Possible API key found in source — verify it's not a real secret."
            exit 1
          else
            echo "No API keys found in source."
          fi
