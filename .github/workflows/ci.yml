name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies (incl. dev tools)
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files (syntax)
        run: |
          for f in *.php app/*.php tests/*.php; do
            php -l "$f"
          done

      - name: Lint JavaScript
        run: |
          node --check sanitize.js
          node --check sw.js

      - name: Run PHP unit tests
        run: |
          php tests/test_weather.php
          php tests/test_ratelimit.php
          php tests/test_onecall.php

      - name: Run PHP HTTP integration tests (APCu cache path enabled)
        run: php tests/test_http.php

      - name: Run controller integration tests
        run: php tests/test_controller.php

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis (PHPStan)
        run: php vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=512M

      - name: Code style (PHP-CS-Fixer, dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the commit range, so it needs history
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      # The gitleaks action builds its scan range from the first page of PR commits (30),
      # so a secret added in a later commit is never scanned. Run the scanner directly
      # over the full base..head range instead.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan (full PR range)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          head="$HEAD_SHA"
          [[ -n $head ]] || head=$(git rev-parse HEAD)

          # A base is only usable if it is non-empty, not the all-zero SHA that
          # GitHub reports for new branches, and actually present in the checkout.
          # A force-push can make push.before unreachable; scanning against it
          # would fail the workflow even though there is nothing wrong with the code.
          valid_base=false
          if [[ -n $base ]] && [[ ! $base =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            valid_base=true
          fi

          if [[ $valid_base == true ]]; then
            # PRs and ordinary pushes: scan exactly the changed range.
            log_opts="${base}..${head}"
            echo "Scanning ${log_opts}"
          else
            # No usable base (new/root-only branch or unreachable before SHA):
            # scan the full history through head, including the first commit.
            log_opts="${head}"
            echo "No valid base; scanning full history through ${head}"
          fi
          gitleaks detect --redact --verbose --exit-code 1 --log-opts="${log_opts}"
      - name: Check for leftover secrets / obvious issues
        run: |
          echo "Scanning for accidentally committed API keys..."
          if grep -rIln "OPENWEATHERMAP_API_KEY=[A-Za-z0-9]\{20,\}\|appid=[A-Za-z0-9]\{20,\}" \
              --exclude-dir=.git --exclude-dir=vendor --exclude-dir=var . ; then
            echo "::error::Possible API key found in source — verify it's not a real secret."
            exit 1
          else
            echo "No API keys found in source."
          fi
