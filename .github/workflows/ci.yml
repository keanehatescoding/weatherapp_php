name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session, apcu
          ini-values: apc.enable_cli=1
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies (incl. dev tools)
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files (syntax)
        run: |
          for f in *.php app/*.php tests/*.php; do
            php -l "$f"
          done

      - name: Lint JavaScript
        run: |
          node --check sanitize.js
          node --check sw.js

      - name: Run PHP unit tests
        run: |
          php tests/test_weather.php
          php tests/test_ratelimit.php
          php tests/test_onecall.php

      - name: Run PHP HTTP integration tests (APCu cache path enabled)
        run: php tests/test_http.php

      - name: Run controller integration tests
        run: php tests/test_controller.php

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Static analysis (PHPStan)
        run: php vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress --memory-limit=512M

      - name: Code style (PHP-CS-Fixer, dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the commit range, so it needs history
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, session
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for leftover secrets / obvious issues
        run: |
          echo "Scanning for accidentally committed API keys..."
          if grep -rIln "OPENWEATHERMAP_API_KEY=[A-Za-z0-9]\{20,\}\|appid=[A-Za-z0-9]\{20,\}" \
              --exclude-dir=.git --exclude-dir=vendor --exclude-dir=var . ; then
            echo "::error::Possible API key found in source — verify it's not a real secret."
            exit 1
          else
            echo "No API keys found in source."
          fi

  # Build and publish the production image from master. Running from the same
  # workflow as test/quality/security means an image is only published after
  # every gate has passed.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [test, quality, security]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
