<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8C%A4%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>🌤️ WeatherApp</title>
<style>.search-container { max-width: 500px; margin: 0 auto; }</style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h3 class="display-6 fw-bold text-primary mb-2">🌤️ WeatherApp</h3>
            <p class="text-muted">Get weather information for any city</p>
        </div>
        
        <div class="card shadow-lg border-0 search-container">
            <div class="card-body p-4">
                <form action="logic.php" method="POST">
                    <input type="hidden" name="csrf" id="csrf-token" value="">
                    <input type="hidden" name="lat" id="lat" value="">
                    <input type="hidden" name="lon" id="lon" value="">
                    <div class="mb-3">
                        <label for="city" class="form-label fw-semibold">Enter City Name</label>
                        <input type="text" name="city" placeholder="e.g., Nairobi, Mombasa, Kisumu" id="city" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3 d-flex gap-2 justify-content-center align-items-center">
                        <span class="fw-semibold">Units:</span>
                        <div class="btn-group" role="group" aria-label="Temperature units">
                            <input type="radio" class="btn-check" name="unit" id="unit-c" value="metric" autocomplete="off" checked>
                            <label class="btn btn-outline-secondary btn-sm" for="unit-c">°C</label>
                            <input type="radio" class="btn-check" name="unit" id="unit-f" value="imperial" autocomplete="off">
                            <label class="btn btn-outline-secondary btn-sm" for="unit-f">°F</label>
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" class="btn btn-success btn-lg w-100 fw-semibold">
                        Get Weather 🔍
                    </button>
                    <button type="button" id="geo-btn" class="btn btn-outline-secondary btn-lg w-100 fw-semibold mt-2">
                        📍 Use my location
                    </button>
                </form>
            </div>
        </div>

        <div id="city-warning" class="alert alert-danger mt-3" role="alert" style="display: none;">
            Only letters, spaces, hyphens apostrophes are allowed
        </div>

        <div id="recent-searches" class="recent-searches mt-3" style="display: none;">
            <span class="fw-semibold small text-muted me-1">Recent:</span>
        </div>

        <!-- AJAX results render here; no-JS submits the form for a full page. -->
        <div id="weather-result" class="mt-3" aria-live="polite"></div>
    </div>

    <script src="sanitize.js"></script>
</body>
</html>
