server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # Static assets and the SPA shell.
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP endpoints are handled by php-fpm over the loopback interface.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Never expose dotfiles (including .env) through the web server.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
